<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>机房信息管理系统</title>
    <link rel="icon" type="image/x-icon" href="/static/favorite.ico" />

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font-awesome/css/font-awesome.css" rel="stylesheet">

    <link href="/static/css/animate.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">

</head>

<body class="bg-img">

    <div class="middle-box text-center loginscreen animated fadeInDown">
        <div>
            <div>
                <h1 class="logo-name"><a href="http://www.shiep.edu.cn/"  target="_blank" ><img class="school-img"/></a></h1>
            </div>
            <h3>机房信息管理系统</h3>
            <div id="login-msg" class="alert alert-danger" style="display:none; text-align:left;"></div>
            <form class="m-t" role="form" action="#">
                <div class="form-group">
                    <input type="username" id="uid" class="form-control" placeholder="账号" required="">
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="密码" required="">
                </div>
                <button type="button" id="submit" class="btn btn-success block full-width m-b">登录</button>

                <a href="#"><small>忘记密码？<small></a>
                <p class="text-muted text-center"><small>还没有账号？</small></p>
                <a class="btn btn-sm btn-white btn-block zitiblue" id="register" href="/register_show">注册</a>
            </form>
            
        </div>
    </div>

    <!-- Mainly scripts -->
    <script src="/static/js/jquery-3.1.1.min.js"></script>
    <script src="/static/js/bootstrap.min.js"></script>
    <script src="/static/layer.js"></script>
    <script type="text/javascript">
		function showLoginMsg(text, type) {
			var $m = $("#login-msg");
			$m.removeClass("alert-danger alert-success alert-warning");
			$m.addClass(type || "alert-danger");
			$m.text(text).stop(true, true).fadeIn();
		}
		function doLogin() {
			var uid = $.trim($("#uid").val());
			var pwd = $("#password").val();
			if (!uid) { showLoginMsg("请输入账号", "alert-warning"); return; }
			if (!pwd) { showLoginMsg("请输入密码", "alert-warning"); return; }
			$("#submit").prop("disabled", true).text("登录中...");
			$.ajax({
				type : "POST",
				dataType : "json",
				data : { "uid" : uid, "password" : pwd },
				url : "login/",
				success : function(data) {
					if (data.res == 1 || data.res == 2) {
						showLoginMsg("登录成功，正在跳转...", "alert-success");
						location.href = 'index/';
					} else if (data.res == 0) {
						showLoginMsg("密码错误，请重新输入");
					} else if (data.res == -1) {
						showLoginMsg("该账号不存在，请检查账号或先注册（前台账号是用户编号，如 2002，不是 admin）");
					} else {
						showLoginMsg("登录失败，请稍后重试");
					}
				},
				error : function() {
					showLoginMsg("无法连接服务器，请确认服务已启动后重试");
				},
				complete : function() {
					$("#submit").prop("disabled", false).text("登录");
				}
			});
		}
		$("#submit").click(doLogin);
		$("#uid, #password").keydown(function(e) {
			if (e.keyCode === 13) { e.preventDefault(); doLogin(); }
		});
	</script>

</body>

</html>
